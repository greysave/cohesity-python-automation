[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cohesity-python-automation"
version = "0.1.0"
description = "Unofficial, original portfolio example: typed REST client, retries, pagination and reporting for a data-protection platform API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
cohesity-report = "cohesity_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cohesity_automation = ["py.typed"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.ruff]
line-length = 100
